<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalon dans la rue — Prototype</title>
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

<div class="phone">
  <div class="phone-screen">

    <!-- Status bar -->
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <img class="icon-signal" src="assets/icon-signal.png" alt="">
        <img class="icon-wifi" src="assets/icon-wifi.png" alt="">
        <img class="icon-battery" src="assets/icon-battery.png" alt="">
      </div>
    </div>

    <!-- Screens -->
    <main class="screens">

      <!-- Accueil / Carte -->
      <section class="screen" id="screen-carte" data-screen="carte">
        <form class="search-bar" onsubmit="return false;">
          <input type="text" placeholder="Recherchez un lieu, un artiste,...">
          <button type="submit" aria-label="Rechercher">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/><line x1="20" y1="20" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </form>

        <div class="map-wrap">
          <img src="assets/map-bg.jpg" alt="Carte de Chalon-sur-Saône avec les emplacements du festival" class="map-img">

          <button class="map-pin" style="left:62%; top:38%;" data-action="open-pastille" data-spot="68" aria-label="Voir les spectacles Place Sainte-Marie">68</button>
          <button class="map-pin map-pin--alt" style="left:38%; top:56%;" data-action="open-pastille" data-spot="73" aria-label="Voir les spectacles Rue d’Uxelles">73</button>

          <button class="filter-btn" aria-label="Filtrer la carte" data-action="open-filtres-carte">
            <img src="assets/sliders.png" alt="">
          </button>
        </div>
      </section>

      <!-- Planning ("À voir") -->
      <section class="screen" id="screen-planning" data-screen="planning">
        <header class="screen-header"><h1>Planning</h1></header>
        <div class="screen-body" id="planning-body"></div>
      </section>

      <!-- Favoris -->
      <section class="screen" id="screen-favoris" data-screen="favoris">
        <header class="screen-header"><h1>Favoris</h1></header>
        <div class="screen-body" id="favoris-body"></div>
      </section>

      <!-- Découvrir -->
      <section class="screen" id="screen-decouvrir" data-screen="decouvrir">
        <header class="screen-header"><h1>Découvrir</h1></header>
        <form class="search-bar search-bar--inline" onsubmit="return false;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/><line x1="20" y1="20" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="decouvrir-search" placeholder="Quel spectacle recherchez-vous ?">
        </form>
        <div class="chip-row">
          <button class="chip" data-action="open-filtres">Horaire</button>
          <button class="chip" data-action="open-filtres">Date</button>
          <button class="chip" data-action="open-filtres">IN/OFF</button>
          <button class="chip" data-action="open-filtres">Catégorie</button>
          <button class="chip" data-action="open-filtres">Compagnies émergentes</button>
        </div>
        <button class="link-row" data-action="open-filtres">Tous les filtres</button>
        <div class="screen-body" id="decouvrir-body"></div>
      </section>

      <!-- Menu -->
      <section class="screen" id="screen-menu" data-screen="menu">
        <header class="screen-header"><h1>Menu</h1></header>
        <div class="screen-body" id="menu-body"></div>
      </section>

    </main>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <button class="nav-item" data-target="planning">
        <span class="nav-icon"><img src="assets/pin.png" alt=""></span>
        <span class="nav-label">Planning</span>
      </button>
      <button class="nav-item" data-target="favoris">
        <span class="nav-icon"><img src="assets/heart.png" alt=""></span>
        <span class="nav-label">Favoris</span>
      </button>
      <button class="nav-item is-active" data-target="carte">
        <span class="nav-icon nav-icon--active"><img src="assets/binoculars.png" alt=""></span>
        <span class="nav-label">Carte</span>
      </button>
      <button class="nav-item" data-target="decouvrir">
        <span class="nav-icon"><img src="assets/megaphone.png" alt=""></span>
        <span class="nav-label">Découvrir</span>
      </button>
      <button class="nav-item" data-target="menu">
        <span class="nav-icon"><img src="assets/house.png" alt=""></span>
        <span class="nav-label">Menu</span>
      </button>
    </nav>

    <!-- Bottom sheets -->
    <div class="sheet-backdrop" id="sheet-backdrop" data-action="close-sheets"></div>

    <div class="sheet" id="sheet-filtres">
      <header class="sheet-header sheet-header--form">
        <button class="icon-btn" data-action="close-sheets" aria-label="Fermer"><img src="assets/fermer.png" alt=""></button>
        <h2>Filtres</h2>
        <button class="link-reset" id="filtres-reset">Réinitialiser</button>
      </header>
      <div class="sheet-body" id="filtres-body"></div>
      <div class="sheet-footer">
        <button class="btn-primary" data-action="close-sheets">Afficher les résultats</button>
      </div>
    </div>

    <div class="sheet" id="sheet-filtres-carte">
      <div class="sheet-banner">Filtrez les éléments de la carte</div>
      <div class="sheet-body" id="filtres-carte-body"></div>
      <div class="sheet-footer sheet-footer--center">
        <button class="confirm-btn" data-action="close-sheets" aria-label="Valider">
          <img src="assets/verifier.png" alt="">
        </button>
      </div>
    </div>

    <div class="sheet sheet--pastille" id="sheet-pastille">
      <header class="sheet-header">
        <h2 id="pastille-title">Lieu</h2>
        <span class="pin-badge" id="pastille-badge"></span>
        <button class="icon-btn icon-btn--floating" data-action="close-sheets" aria-label="Fermer"><img src="assets/fermer.png" alt=""></button>
      </header>
      <div class="sheet-body" id="pastille-body"></div>
    </div>

    <!-- Full screen overlay: fiche spectacle -->
    <div class="overlay-page" id="overlay-spectacle">
      <header class="overlay-header">
        <button class="icon-btn" data-action="close-overlay" aria-label="Retour">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 id="overlay-title"></h2>
      </header>
      <div class="overlay-body" id="overlay-body"></div>
    </div>

  </div>
</div>

<script src="data.js?v=2"></script>
<script src="script.js?v=2"></script>
</body>
</html>
